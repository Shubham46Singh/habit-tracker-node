version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.18

jobs:
  lint:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys: [npm-{{ checksum "package.json" }}]
      - run: npm install
      - save_cache:
          key: npm-{{ checksum "package.json" }}
          paths: [node_modules]
      - run: npm run lint

  unit:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys: [npm-{{ checksum "package.json" }}]
      - run: npm install
      - run: npm test

  integration:
    docker:
      # In CircleCI service containers the host is localhost (the opposite of compose).
      - image: cimg/node:20.18
        environment:
          DATABASE_URL: postgres://habit:habit@localhost:5432/habits
          REDIS_URL: redis://localhost:6379
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habits
      - image: cimg/redis:7.2
    steps:
      - checkout
      - restore_cache:
          keys: [npm-{{ checksum "package.json" }}]
      - run: npm install
      - run:
          name: Wait for Postgres and Redis
          command: dockerize -wait tcp://localhost:5432 -wait tcp://localhost:6379 -timeout 60s
      - run:
          name: Apply migrations
          command: npm run migrate
      - run: npm run test:integration

  secret-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Scan git history for secrets
          command: |
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
            ./gitleaks detect --source . --verbose --redact

  build-image:
    docker:
      - image: cimg/base:stable
    environment:
      IMAGE_VERSION: "1.0"
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image
          command: docker build -t "$DOCKERHUB_USER/habit-tracker:$IMAGE_VERSION" -t "$DOCKERHUB_USER/habit-tracker:latest" .
      - run:
          name: Push to Docker Hub (main branch only)
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
              docker push "$DOCKERHUB_USER/habit-tracker:$IMAGE_VERSION"
              docker push "$DOCKERHUB_USER/habit-tracker:latest"
            else
              echo "Not on main, skipping push"
            fi

workflows:
  ci:
    jobs:
      - lint
      - unit:
          requires: [lint]
      - integration:
          requires: [unit]
      - secret-scan:
          requires: [integration]
      - build-image:
          requires: [secret-scan]
